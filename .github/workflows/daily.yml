name: Daily summary (10:00 ET)

on:
  schedule:
    # 10:00 ET is 14:00 UTC in EDT and 15:00 UTC in EST. Both fire; the guard
    # below exits on whichever one is not currently 10:00 America/New_York, so
    # the summary lands at 10am year-round without a DST edit.
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: DST guard — only proceed at 10:00 America/New_York
        id: guard
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "New York hour: $HOUR"
          if [ "$HOUR" != "10" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Restore caches
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .httpcache
            .state
          key: providers-daily-${{ github.run_id }}
          restore-keys: providers-

      - name: Refresh then summarise
        if: steps.guard.outputs.skip != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATAROMA_HOURS: "72"
        run: |
          python -m src.build --stage all
          python -m src.alerts.engine daily

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/daily .state || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "daily: summary $(TZ=America/New_York date +'%Y-%m-%d')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
