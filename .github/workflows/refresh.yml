name: Refresh data

on:
  schedule:
    # Quotes during US market hours (13:30–20:00 UTC ≈ 9:30–16:00 ET), weekdays.
    - cron: "*/15 13-20 * * 1-5"
    # Full rebuild incl. fundamentals + ownership, 05:00 UTC daily.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Build stage"
        default: "all"
        type: choice
        options: [all, quotes, fundamentals, ownership]

concurrency:
  # keyed by stage so a scheduled quotes run never cancels a manual full rebuild
  group: refresh-${{ github.event.inputs.stage || (github.event.schedule == '0 5 * * *' && 'all' || 'quotes') }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Persist HTTP + provider caches so Dataroma honours its 72h cadence
      # and we stay polite to every upstream.
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            .httpcache
            .state
          key: providers-${{ github.run_id }}
          restore-keys: providers-

      - name: Build
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          DATAROMA_HOURS: "72"
        run: |
          STAGE="${{ github.event.inputs.stage }}"
          if [ -z "$STAGE" ]; then
            # the 05:00 run does everything; the intraday runs only refresh quotes
            if [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then STAGE=all; else STAGE=quotes; fi
          fi
          echo "stage=$STAGE"
          python -m src.build --stage "$STAGE"

      - name: Alerts
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.alerts.engine alerts

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/daily .state || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Trigger Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with GITHUB_TOKEN does not trigger other workflows
          # (GitHub's infinite-loop guard), so Deploy Pages is invoked explicitly.
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
