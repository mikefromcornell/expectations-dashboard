name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # data/ lives outside docs/, so copy it in for the published site
      - run: |
          mkdir -p docs/data
          cp -r data/*.json docs/data/ 2>/dev/null || true
          cp -r data/history docs/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
