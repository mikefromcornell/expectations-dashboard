# Buffett Lens thresholds (PRD §5, Buffett tab).
# Deterministic checklist from his published criteria — disagree with a
# threshold by editing it here rather than trusting a black box.
moat_roic_wide:            18.0   # ROIC % for a "wide" moat
moat_roic_narrow:          10.0   # ROIC % for "narrow"
returns_min_roic:          15.0   # returns-on-capital test
max_debt_equity:            1.0   # conservative leverage test
min_fcf_margin:            10.0   # cash generation test
min_margin_of_safety_pct:  15.0   # price test vs your fair value
