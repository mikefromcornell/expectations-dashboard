# Expectations inputs.
#
# ── Automatic fair value ──────────────────────────────────────────────
# fair_value = target_pe × LTM EPS   (EPS derived as price ÷ LTM P/E)
#
# This is a deliberately crude anchor, not a valuation. A flat 20× applies the
# same multiple to a 90%-ROIC compounder and a cyclical, so treat the resulting
# Expectations Gap as a screen that says "look here", never as a target price.
# Replace any ticker with a real number below and the manual value always wins.
#
# Only applies to equities/ADRs with a positive LTM P/E — funds, loss-makers and
# suppressed tickers are skipped, and their gap column stays empty.
auto_fair_value:
  enabled: false
  target_pe: 20

# ── Manual overrides (these take precedence) ──────────────────────────
# AAPL:
#   fair_value: 290.00
#   market_implied_growth: 0.11
#   notes: "Services mix shift already priced in"
